name: Diagnose the native Windows portable launcher

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      CSC_IDENTITY_AUTO_DISCOVERY: "false"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - id: metadata
        run: node scripts/release-metadata.mjs
      - run: npm ci
      - id: package
        run: npm run package:win -- --publish never
      - name: Diagnose the actual Windows portable container
        run: >-
          node scripts/installer-smoke.mjs
          --platform windows --arch x64 --output release/windows
          --version "${{ steps.metadata.outputs.version }}"
          --report release-proof/installer-smoke.json
          --diagnostic-container portable
      - name: Preserve the validation report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: windows-installer-diagnostics-${{ github.sha }}
          path: release-proof/*
          if-no-files-found: ignore
          retention-days: 7
